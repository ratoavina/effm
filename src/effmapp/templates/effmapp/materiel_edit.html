{% extends 'base/base.html' %}

{% block title %}
  <title>UpdateClient</title>
{% endblock %}


{% block content %}
<div class="container">
  <div class="row">
    <div class="col-md-2">
    </div>
    <div class="col-md-8">
      <center>
          <img class="logos" src="" width="100%">
          <h2>Pour editer le produit, </h2>
          <h3>Veuiller remplir le formulaire</h3>
        </center>
        {% if user.is_authenticated %}
        <form method="POST">
          {% csrf_token %} 
          <div class="form-group">
              <label for="desination">Designation : </label>
              <div class="position-relative has-icon-right">
                  <input type="text" class="form-control input-shadow" id="id_desination" name="desination" autofocus="" autocapitaliza="none" autocomplete="desination" maxlength="100" value="{{ produit.desination }}">
                  <div class="form-control-position">
                      <i class="icon-user"></i>
                  </div>
              </div>
          </div>
          <div class="form-group">
              <label for="prix_u">Prix Unit : </label>
              <div class="position-relative has-icon-right">
                  <input type="text" class="form-control input-shadow" id="id_prix_u" name="prix_u" autofocus="" autocapitaliza="none" autocomplete="prix_u" maxlength="100" value="{{ produit.prix_u }}">
                  <div class="form-control-position">
                      <i class="icon-user"></i>
                  </div>
              </div>
          </div>
          <div class="form-group">
              <label for="entre">Entre : </label>
              <div class="position-relative has-icon-right">
                  <input type="text" class="form-control input-shadow" id="id_entre" name="entre" autofocus="" autocapitaliza="none" autocomplete="entre" maxlength="100" value="{{ produit.entre }}">
                  <div class="form-control-position">
                      <i class="icon-user"></i>
                  </div>
              </div>
          </div>
          <div class="form-group">
              <label for="stock">Stock : </label>
              <div class="position-relative has-icon-right">
                  <input type="text" class="form-control input-shadow" id="id_stock" name="stock" autofocus="" autocapitaliza="none" autocomplete="stock" maxlength="100" value="{{ produit.stock }}">
                  <div class="form-control-position">
                      <i class="icon-user"></i>
                  </div>
              </div>
          </div>
          <div class="form-group">
              <label for="total_stock">T.Stock : </label>
              <div class="position-relative has-icon-right">
                  <input type="text" class="form-control input-shadow" id="id_total_stock" name="total_stock" autofocus="" autocapitaliza="none" autocomplete="total_stock" maxlength="100" value="{{ produit.total_stock }}">
                  <div class="form-control-position">
                      <i class="icon-user"></i>
                  </div>
              </div>
          </div>
          <div class="form-group">
              <label for="sortie">Sortie : </label>
              <div class="position-relative has-icon-right">
                  <input type="text" class="form-control input-shadow" id="id_sortie" name="sortie" autofocus="" autocapitaliza="none" autocomplete="sortie" maxlength="100" value="{{ produit.sortie }}">
                  <div class="form-control-position">
                      <i class="icon-user"></i>
                  </div>
              </div>
          </div>
          <div class="form-group">
              <label for="recette">Recette : </label>
              <div class="position-relative has-icon-right">
                  <input type="text" class="form-control input-shadow" id="id_recette" name="recette" autofocus="" autocapitaliza="none" autocomplete="recette" maxlength="100" value="{{ produit.recette }}">
                  <div class="form-control-position">
                      <i class="icon-user"></i>
                  </div>
              </div>
          </div>
          <div class="form-group">
              <label for="stock_31">Stock31 : </label>
              <div class="position-relative has-icon-right">
                  <input type="text" class="form-control input-shadow" id="id_stock_31" name="stock_31" autofocus="" autocapitaliza="none" autocomplete="stock_31" maxlength="100" value="{{ produit.stock_31 }}">
                  <div class="form-control-position">
                      <i class="icon-user"></i>
                  </div>
              </div>
          </div>
          <div class="form-group">
              <label for="desination">Date de peremptiom : </label>
              <div class="position-relative has-icon-right">
                  <input type="text" class="form-control input-shadow" id="id_date_de_peremptiom" name="date_de_peremptiom" autofocus="" autocapitaliza="none" autocomplete="date_de_peremptiom" maxlength="100" value="{{ produit.date_de_peremption }}">
                  <div class="form-control-position">
                      <i class="icon-user"></i>
                  </div>
              </div>
          </div>
          <div class="form-group">
              <label for="montant_physique">Montant Total Physique : </label>
              <div class="position-relative has-icon-right">
                  <input type="text" class="form-control input-shadow" id="id_montant_physique" name="montant_physique" autofocus="" autocapitaliza="none" autocomplete="montant_physique" maxlength="100" value="{{ produit.montant_physique }}">
                  <div class="form-control-position">
                      <i class="icon-user"></i>
                  </div>
              </div>
          </div>
          <div class="form-row">
              <div class="col-md-2"></div>
              <div class="col-md-8">
                <button type="submit" class="btn btn-primary btn-lg btn-block">Edit</button>
              </div>
              <div class="col-md-2"></div>
          </div>
        </form>
        {% endif %}
      </div>
    </div>
    <div class="col-md-2">
    </div>
  </div>
</div>
{%  endblock %}
